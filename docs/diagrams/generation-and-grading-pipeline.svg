<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="1020" viewBox="0 0 1650 1020" role="img" aria-labelledby="title desc">
  <title id="title">Generation &amp; Multi-Variation Grading Pipeline</title>
  <desc id="desc">High-level Genesis diagram. Editable Excalidraw source is stored beside this SVG.</desc>
