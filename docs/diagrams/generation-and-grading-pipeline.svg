  <g><rect x="40" y="100" width="220" height="150" rx="9" fill="#dbe4ff" stroke="#4263eb" stroke-width="2.2" filter="url(#rough)"/><text x="150" y="132" text-anchor="middle" class="node-title">User prompt</text><text x="150" y="161" text-anchor="middle" class="node-body">Raw request + chat history</text>
<text x="150" y="180" text-anchor="middle" class="node-body">generateApp (SSE)</text></g>
<g><rect x="300" y="90" width="260" height="170" rx="9" fill="#c5f6fa" stroke="#0b7285" stroke-width="2.2" filter="url(#rough)"/><text x="430" y="122" text-anchor="middle" class="node-title">Structured planner</text><text x="430" y="151" text-anchor="middle" class="node-body">Classify single vs variations</text>
<text x="430" y="170" text-anchor="middle" class="node-body">Derive shared feature contract</text>
<text x="430" y="189" text-anchor="middle" class="node-body">Confidence floor 0.8</text></g>
<g><polygon points="690,85 780,175 690,265 600,175" fill="#fff3bf" stroke="#e67700" stroke-width="2.2" filter="url(#rough)"/><text x="690" y="117" text-anchor="middle" class="node-title">Mode?</text><text x="690" y="146" text-anchor="middle" class="node-body">single / variations</text></g>
<g><rect x="830" y="100" width="260" height="150" rx="9" fill="#e5dbff" stroke="#7048e8" stroke-width="2.2" filter="url(#rough)"/><text x="960" y="132" text-anchor="middle" class="node-title">Single-generation path</text><text x="960" y="161" text-anchor="middle" class="node-body">Stream one app directly</text>
<text x="960" y="180" text-anchor="middle" class="node-body">Persist a normal snapshot</text></g>
<g><rect x="300" y="340" width="260" height="160" rx="9" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2.2" filter="url(#rough)"/><text x="430" y="372" text-anchor="middle" class="node-title">4 variation briefs</text><text x="430" y="401" text-anchor="middle" class="node-body">One shared feature contract</text>
<text x="430" y="420" text-anchor="middle" class="node-body">≥3 differentiators each</text>
<text x="430" y="439" text-anchor="middle" class="node-body">No brief is called "best"</text></g>
<g><rect x="600" y="340" width="280" height="160" rx="9" fill="#e5dbff" stroke="#7048e8" stroke-width="2.2" filter="url(#rough)"/><text x="740" y="372" text-anchor="middle" class="node-title">Candidate worker pool</text><text x="740" y="401" text-anchor="middle" class="node-body">4 parallel model calls</text>
<text x="740" y="420" text-anchor="middle" class="node-body">concurrency = 4 (fully parallel)</text>
<text x="740" y="439" text-anchor="middle" class="node-body">independent, isolated calls</text></g>
<g><rect x="940" y="340" width="260" height="160" rx="9" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2.2" filter="url(#rough)"/><text x="1070" y="372" text-anchor="middle" class="node-title">In-memory candidates</text><text x="1070" y="401" text-anchor="middle" class="node-body">3 files + usage each</text>
<text x="1070" y="420" text-anchor="middle" class="node-body">Nothing streamed before ranking</text></g>
<g><rect x="300" y="580" width="260" height="190" rx="9" fill="#fff3bf" stroke="#e67700" stroke-width="2.2" filter="url(#rough)"/><text x="430" y="612" text-anchor="middle" class="node-title">Deterministic qualify</text><text x="430" y="641" text-anchor="middle" class="node-body">Hard: schema, forbidden APIs,</text>
<text x="430" y="660" text-anchor="middle" class="node-body">Vue runtime, app.js parses</text>
<text x="430" y="679" text-anchor="middle" class="node-body">Soft: HL contracts, states,</text>
<text x="430" y="698" text-anchor="middle" class="node-body">a11y, responsive scoring</text></g>
<g><rect x="600" y="580" width="300" height="190" rx="9" fill="#c5f6fa" stroke="#0b7285" stroke-width="2.2" filter="url(#rough)"/><text x="750" y="612" text-anchor="middle" class="node-title">Blinded rubric grading</text><text x="750" y="641" text-anchor="middle" class="node-body">Shuffle + alias candidates</text>
<text x="750" y="660" text-anchor="middle" class="node-body">Fidelity 30 · correctness 25</text>
<text x="750" y="679" text-anchor="middle" class="node-body">robustness 15 · usability 10</text>
<text x="750" y="698" text-anchor="middle" class="node-body">a11y 10 · responsive 5 · maint. 5</text></g>
<g><rect x="940" y="580" width="260" height="190" rx="9" fill="#e5dbff" stroke="#7048e8" stroke-width="2.2" filter="url(#rough)"/><text x="1070" y="612" text-anchor="middle" class="node-title">Deterministic ranking</text><text x="1070" y="641" text-anchor="middle" class="node-body">Total score → fidelity →</text>
<text x="1070" y="660" text-anchor="middle" class="node-body">correctness → alias tiebreak</text>
<text x="1070" y="679" text-anchor="middle" class="node-body">No pairwise comparison pass</text></g>
<g><rect x="1240" y="580" width="230" height="190" rx="9" fill="#ffe3e3" stroke="#c92a2a" stroke-width="2.2" filter="url(#rough)"/><text x="1355" y="612" text-anchor="middle" class="node-title">&lt; 2 eligible: stop safely</text><text x="1355" y="641" text-anchor="middle" class="node-body">Persist nothing</text>
<text x="1355" y="660" text-anchor="middle" class="node-body">Project stays unchanged</text></g>
<g><rect x="300" y="820" width="280" height="160" rx="9" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2.2" filter="url(#rough)"/><text x="440" y="852" text-anchor="middle" class="node-title">Persist top 2 finalists</text><text x="440" y="881" text-anchor="middle" class="node-body">variationSets/{id} + 2</text>
<text x="440" y="900" text-anchor="middle" class="node-body">candidate docs; other 2</text>
<text x="440" y="919" text-anchor="middle" class="node-body">candidates are discarded</text></g>
<g><rect x="630" y="820" width="260" height="160" rx="9" fill="#dbe4ff" stroke="#4263eb" stroke-width="2.2" filter="url(#rough)"/><text x="760" y="852" text-anchor="middle" class="node-title">Comparison UI</text><text x="760" y="881" text-anchor="middle" class="node-body">VariationComparison.vue</text>
<text x="760" y="900" text-anchor="middle" class="node-body">Direction A / B sandboxed iframes</text></g>
<g><rect x="940" y="820" width="260" height="160" rx="9" fill="#e5dbff" stroke="#7048e8" stroke-width="2.2" filter="url(#rough)"/><text x="1070" y="852" text-anchor="middle" class="node-title">User selects a finalist</text><text x="1070" y="881" text-anchor="middle" class="node-body">selectVariationFinalist</text>
<text x="1070" y="900" text-anchor="middle" class="node-body">checks base snapshot still current</text></g>
<g><rect x="1240" y="820" width="230" height="160" rx="9" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2.2" filter="url(#rough)"/><text x="1355" y="852" text-anchor="middle" class="node-title">Promote to active</text><text x="1355" y="881" text-anchor="middle" class="node-body">New snapshot · replace files/</text>
<text x="1355" y="900" text-anchor="middle" class="node-body">clear pendingVariationSetId</text></g>
</svg>
