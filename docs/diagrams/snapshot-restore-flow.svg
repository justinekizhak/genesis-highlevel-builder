<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">Files, Snapshots, and Restore</title>
  <desc id="desc">High-level Genesis diagram. Editable Excalidraw source is stored beside this SVG.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="context-stroke"/></marker>
    <filter id="rough" x="-5%" y="-7%" width="110%" height="114%"><feTurbulence type="fractalNoise" baseFrequency="0.025 0.12" numOctaves="2" seed="41" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="1.7"/></filter>
    <filter id="rough-line" x="-8%" y="-12%" width="116%" height="124%"><feTurbulence type="fractalNoise" baseFrequency="0.04 0.18" numOctaves="2" seed="17" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="2"/></filter>
    <style>.heading{font:700 30px "Marker Felt","Comic Sans MS",cursive;fill:#1e1e1e}.node-title{font:700 17px "Marker Felt","Comic Sans MS",cursive;fill:#1e1e1e}.node-body{font:14px "Marker Felt","Comic Sans MS",cursive;fill:#495057}.edge-label{font:700 13px "Marker Felt","Comic Sans MS",cursive}</style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="40" y="51" class="heading">Files, Snapshots, and Restore</text>
  <path d="M35 70 Q 600 66 1165 70" stroke="#1e1e1e" stroke-width="1" opacity=".22" fill="none" filter="url(#rough-line)"/>
  <g><path d="M 275 160 Q 353 218.5 425 285" fill="none" stroke="#1e1e1e" stroke-width="2.2" marker-end="url(#arrow)" filter="url(#rough-line)"/><rect x="292" y="206.5" width="116" height="23" rx="3" fill="#ffffff"/><text x="350" y="223.5" text-anchor="middle" class="edge-label" fill="#495057">commit</text></g>
<g><path d="M 275 367 Q 353 352 425 345" fill="none" stroke="#1e1e1e" stroke-width="2.2" marker-end="url(#arrow)" filter="url(#rough-line)"/><rect x="292" y="340" width="116" height="23" rx="3" fill="#ffffff"/><text x="350" y="357" text-anchor="middle" class="edge-label" fill="#495057">save</text></g>
<g><path d="M 725 300 Q 793 243.5 855 195" fill="none" stroke="#1e1e1e" stroke-width="2.2" marker-end="url(#arrow)" filter="url(#rough-line)"/><rect x="732" y="231.5" width="116" height="23" rx="3" fill="#ffffff"/><text x="790" y="248.5" text-anchor="middle" class="edge-label" fill="#495057">append snapshot</text></g>
<g><path d="M 985 260 Q 988 303.5 985 355" fill="none" stroke="#1e1e1e" stroke-width="2.2" marker-end="url(#arrow)" filter="url(#rough-line)"/><rect x="927" y="291.5" width="116" height="23" rx="3" fill="#ffffff"/><text x="985" y="308.5" text-anchor="middle" class="edge-label" fill="#495057">history UI</text></g>
<g><path d="M 855 405 Q 830.5 491 800 585" fill="none" stroke="#1e1e1e" stroke-width="2.2" marker-end="url(#arrow)" filter="url(#rough-line)"/></g>
<g><path d="M 540 585 Q 500.5 581 455 585" fill="none" stroke="#1e1e1e" stroke-width="2.2" marker-end="url(#arrow)" filter="url(#rough-line)"/></g>
<g><path d="M 320 535 Q 413 458.5 500 390" fill="none" stroke="#1e1e1e" stroke-width="2.2" marker-end="url(#arrow)" filter="url(#rough-line)"/><rect x="352" y="446.5" width="116" height="23" rx="3" fill="#ffffff"/><text x="410" y="463.5" text-anchor="middle" class="edge-label" fill="#495057">refresh state</text></g>
  <g><rect x="40" y="110" width="235" height="105" rx="9" fill="#e5dbff" stroke="#7048e8" stroke-width="2.2" filter="url(#rough)"/><text x="157.5" y="142" text-anchor="middle" class="node-title">Generation completes</text><text x="157.5" y="171" text-anchor="middle" class="node-body">Files + assistant summary</text></g>
<g><rect x="40" y="315" width="235" height="105" rx="9" fill="#dbe4ff" stroke="#4263eb" stroke-width="2.2" filter="url(#rough)"/><text x="157.5" y="347" text-anchor="middle" class="node-title">User saves an edit</text><text x="157.5" y="376" text-anchor="middle" class="node-body">Complete current file set</text></g>
<g><rect x="425" y="255" width="300" height="135" rx="9" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2.2" filter="url(#rough)"/><text x="575" y="287" text-anchor="middle" class="node-title">Current project files</text><text x="575" y="316" text-anchor="middle" class="node-body">index.html · styles.css · app.js</text>
<text x="575" y="335" text-anchor="middle" class="node-body">Used by editor and preview</text></g>
<g><rect x="855" y="125" width="260" height="135" rx="9" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2.2" filter="url(#rough)"/><text x="985" y="157" text-anchor="middle" class="node-title">Append-only history</text><text x="985" y="186" text-anchor="middle" class="node-body">Generation snapshots</text>
<text x="985" y="205" text-anchor="middle" class="node-body">Manual-edit snapshots</text>
<text x="985" y="224" text-anchor="middle" class="node-body">Partial snapshots</text></g>
<g><rect x="855" y="355" width="260" height="105" rx="9" fill="#dbe4ff" stroke="#4263eb" stroke-width="2.2" filter="url(#rough)"/><text x="985" y="387" text-anchor="middle" class="node-title">Choose Restore</text><text x="985" y="416" text-anchor="middle" class="node-body">Load selected snapshot</text></g>
<g><rect x="540" y="535" width="260" height="105" rx="9" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2.2" filter="url(#rough)"/><text x="670" y="567" text-anchor="middle" class="node-title">Safety backup</text><text x="670" y="596" text-anchor="middle" class="node-body">Capture current files first</text></g>
<g><rect x="185" y="535" width="270" height="105" rx="9" fill="#e5dbff" stroke="#7048e8" stroke-width="2.2" filter="url(#rough)"/><text x="320" y="567" text-anchor="middle" class="node-title">Restore atomically</text><text x="320" y="596" text-anchor="middle" class="node-body">Replace current files</text>
<text x="320" y="615" text-anchor="middle" class="node-body">Update latest snapshot pointer</text></g>
</svg>
