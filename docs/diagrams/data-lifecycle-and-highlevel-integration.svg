  <g><rect x="40" y="100" width="300" height="190" rx="9" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2.2" filter="url(#rough)"/><text x="190" y="132" text-anchor="middle" class="node-title">Firestore collections</text><text x="190" y="161" text-anchor="middle" class="node-body">projects · files · messages</text>
<text x="190" y="180" text-anchor="middle" class="node-body">snapshots · variationSets/candidates</text>
<text x="190" y="199" text-anchor="middle" class="node-body">highlevelConnections · oauthStates</text>
<text x="190" y="218" text-anchor="middle" class="node-body">rateLimits · webhookDedupe · hlEvents</text></g>
<g><rect x="380" y="100" width="220" height="190" rx="9" fill="#fff3bf" stroke="#e67700" stroke-width="2.2" filter="url(#rough)"/><text x="490" y="132" text-anchor="middle" class="node-title">Ownership isolation</text><text x="490" y="161" text-anchor="middle" class="node-body">requireOwnedProject(uid, id)</text>
<text x="490" y="180" text-anchor="middle" class="node-body">enforced in Functions</text>
<text x="490" y="199" text-anchor="middle" class="node-body">and mirrored in Firestore rules</text></g>
<g><rect x="640" y="100" width="210" height="190" rx="9" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2.2" filter="url(#rough)"/><text x="745" y="132" text-anchor="middle" class="node-title">Live files</text><text x="745" y="161" text-anchor="middle" class="node-body">files/ subcollection</text>
<text x="745" y="180" text-anchor="middle" class="node-body">used by editor + preview</text></g>
<g><rect x="890" y="100" width="250" height="190" rx="9" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2.2" filter="url(#rough)"/><text x="1015" y="132" text-anchor="middle" class="node-title">Append-only snapshots</text><text x="1015" y="161" text-anchor="middle" class="node-body">kind: generation · manual</text>
<text x="1015" y="180" text-anchor="middle" class="node-body">partial · backup</text></g>
<g><rect x="1180" y="100" width="260" height="190" rx="9" fill="#e5dbff" stroke="#7048e8" stroke-width="2.2" filter="url(#rough)"/><text x="1310" y="132" text-anchor="middle" class="node-title">Restore</text><text x="1310" y="161" text-anchor="middle" class="node-body">Back up current files first,</text>
<text x="1310" y="180" text-anchor="middle" class="node-body">then overwrite live files,</text>
<text x="1310" y="199" text-anchor="middle" class="node-body">update latestSnapshotId</text></g>
<g><rect x="40" y="350" width="220" height="170" rx="9" fill="#dbe4ff" stroke="#4263eb" stroke-width="2.2" filter="url(#rough)"/><text x="150" y="382" text-anchor="middle" class="node-title">Connect HighLevel</text><text x="150" y="411" text-anchor="middle" class="node-body">hlOAuthStart</text>
<text x="150" y="430" text-anchor="middle" class="node-body">oauthStates doc, 10 min TTL</text></g>
<g><rect x="300" y="350" width="250" height="170" rx="9" fill="#e5dbff" stroke="#7048e8" stroke-width="2.2" filter="url(#rough)"/><text x="425" y="382" text-anchor="middle" class="node-title">hlAuthCallback</text><text x="425" y="411" text-anchor="middle" class="node-body">exchange code for tokens</text>
<text x="425" y="430" text-anchor="middle" class="node-body">backfill locationId on projects</text></g>
<g><rect x="590" y="350" width="260" height="170" rx="9" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2.2" filter="url(#rough)"/><text x="720" y="382" text-anchor="middle" class="node-title">highlevelConnections/{uid}</text><text x="720" y="411" text-anchor="middle" class="node-body">access/refresh tokens</text>
<text x="720" y="430" text-anchor="middle" class="node-body">expiresAt · locationId</text></g>
<g><rect x="890" y="350" width="280" height="170" rx="9" fill="#e5dbff" stroke="#7048e8" stroke-width="2.2" filter="url(#rough)"/><text x="1030" y="382" text-anchor="middle" class="node-title">Lazy refresh + lease</text><text x="1030" y="411" text-anchor="middle" class="node-body">refreshes when &lt;60s to expiry</text>
<text x="1030" y="430" text-anchor="middle" class="node-body">30s Firestore lease</text>
<text x="1030" y="449" text-anchor="middle" class="node-body">rotates both tokens</text></g>
<g><rect x="40" y="590" width="220" height="190" rx="9" fill="#dbe4ff" stroke="#4263eb" stroke-width="2.2" filter="url(#rough)"/><text x="150" y="622" text-anchor="middle" class="node-title">Generated app iframe</text><text x="150" y="651" text-anchor="middle" class="node-body">window.genesis.highlevel</text>
<text x="150" y="670" text-anchor="middle" class="node-body">bridge, no direct network</text></g>
<g><rect x="300" y="590" width="280" height="190" rx="9" fill="#e5dbff" stroke="#7048e8" stroke-width="2.2" filter="url(#rough)"/><text x="440" y="622" text-anchor="middle" class="node-title">hlProxy</text><text x="440" y="651" text-anchor="middle" class="node-body">auth · 60/min rate limit</text>
<text x="440" y="670" text-anchor="middle" class="node-body">8-operation allowlist</text>
<text x="440" y="689" text-anchor="middle" class="node-body">injects locationId server-side</text></g>
<g><rect x="620" y="590" width="220" height="190" rx="9" fill="#c5f6fa" stroke="#0b7285" stroke-width="2.2" filter="url(#rough)"/><text x="730" y="622" text-anchor="middle" class="node-title">HighLevel API</text><text x="730" y="651" text-anchor="middle" class="node-body">contacts · conversations</text>
<text x="730" y="670" text-anchor="middle" class="node-body">calendars · appointments</text></g>
<g><rect x="880" y="590" width="280" height="190" rx="9" fill="#e5dbff" stroke="#7048e8" stroke-width="2.2" filter="url(#rough)"/><text x="1020" y="622" text-anchor="middle" class="node-title">hlWebhook</text><text x="1020" y="651" text-anchor="middle" class="node-body">Ed25519 signature verify</text>
<text x="1020" y="670" text-anchor="middle" class="node-body">webhookDedupe atomic claim</text>
<text x="1020" y="689" text-anchor="middle" class="node-body">maps locationId → uid</text></g>
<g><rect x="1200" y="590" width="260" height="190" rx="9" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2.2" filter="url(#rough)"/><text x="1330" y="622" text-anchor="middle" class="node-title">users/{uid}/hlEvents</text><text x="1330" y="651" text-anchor="middle" class="node-body">Contact/Message/Appointment</text>
<text x="1330" y="670" text-anchor="middle" class="node-body">events relayed live to the iframe</text>
<text x="1330" y="689" text-anchor="middle" class="node-body">UNINSTALL deletes the connection</text></g>
</svg>
