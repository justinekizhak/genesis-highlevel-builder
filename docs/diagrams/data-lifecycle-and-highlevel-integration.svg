<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="940" viewBox="0 0 1650 940" role="img" aria-labelledby="title desc">
  <title id="title">Data Model, Lifecycle &amp; HighLevel Integration</title>
  <desc id="desc">High-level Genesis diagram. Editable Excalidraw source is stored beside this SVG.</desc>
