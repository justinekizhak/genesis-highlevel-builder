<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="700" viewBox="0 0 1320 700" role="img" aria-labelledby="title desc">
  <title id="title">Generation and Preview Flow</title>
  <desc id="desc">Diagram exported alongside an editable Excalidraw source.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker>
    <filter id="rough-shape" x="-4%" y="-6%" width="108%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025 0.12" numOctaves="2" seed="41" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="rough-line" x="-8%" y="-12%" width="116%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04 0.18" numOctaves="2" seed="17" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.1" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <style>
      .heading { font: 700 28px "Marker Felt", "Comic Sans MS", cursive; fill: #1e1e1e; letter-spacing: .4px; }
      .title { font: 700 17px "Marker Felt", "Comic Sans MS", cursive; }
      .small { font: 15px "Marker Felt", "Comic Sans MS", cursive; }
      .label { font: 700 13px "Marker Felt", "Comic Sans MS", cursive; fill: #495057; letter-spacing: .3px; }
      .zone { font: 700 13px "Marker Felt", "Comic Sans MS", cursive; fill: #495057; letter-spacing: 2px; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <path d="M 34 67 Q 660 64 1286 69" stroke="#1e1e1e" stroke-width="1" opacity=".3" fill="none" filter="url(#rough-line)"/>
  <text x="48" y="48" class="heading">Generation and Preview Flow</text>
  
  
  <g>
    <rect x="61.5" y="99" width="230" height="80" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1.1" opacity=".38" filter="url(#rough-line)"/>
    <rect x="60" y="100" width="230" height="80" rx="8" fill="#dbe4ff" stroke="#4263eb" stroke-width="2.2" filter="url(#rough-shape)"/>
    <text x="175" y="131" text-anchor="middle" class="title" fill="#1e1e1e">1 · Send prompt</text>
    <text x="175" y="157" text-anchor="middle" class="small" fill="#1e1e1e">ID token + project ID</text>
  </g>
  
  <g>
    <rect x="371.5" y="99" width="250" height="100" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1.1" opacity=".38" filter="url(#rough-line)"/>
    <rect x="370" y="100" width="250" height="100" rx="8" fill="#fff3bf" stroke="#e67700" stroke-width="2.2" filter="url(#rough-shape)"/>
    <text x="495" y="131" text-anchor="middle" class="title" fill="#1e1e1e">2 · Guard request</text>
    <text x="495" y="157" text-anchor="middle" class="small" fill="#495057">Authenticate · own project</text>
    <text x="495" y="176" text-anchor="middle" class="small" fill="#495057">HighLevel connected</text>
  </g>
  
  <g>
    <rect x="701.5" y="99" width="250" height="100" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1.1" opacity=".38" filter="url(#rough-line)"/>
    <rect x="700" y="100" width="250" height="100" rx="8" fill="#fff3bf" stroke="#e67700" stroke-width="2.2" filter="url(#rough-shape)"/>
    <text x="825" y="131" text-anchor="middle" class="title" fill="#1e1e1e">3 · Control concurrency</text>
    <text x="825" y="157" text-anchor="middle" class="small" fill="#495057">Acquire project lock</text>
    <text x="825" y="176" text-anchor="middle" class="small" fill="#495057">Enforce minute/day limits</text>
  </g>
  
  <g>
    <rect x="1011.5" y="99" width="250" height="100" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1.1" opacity=".38" filter="url(#rough-line)"/>
    <rect x="1010" y="100" width="250" height="100" rx="8" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2.2" filter="url(#rough-shape)"/>
    <text x="1135" y="131" text-anchor="middle" class="title" fill="#1e1e1e">4 · Load context</text>
    <text x="1135" y="157" text-anchor="middle" class="small" fill="#495057">3 files + last 12 messages</text>
    <text x="1135" y="176" text-anchor="middle" class="small" fill="#495057">Persist user prompt</text>
  </g>
  
  <g>
    <rect x="1011.5" y="299" width="250" height="100" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1.1" opacity=".38" filter="url(#rough-line)"/>
    <rect x="1010" y="300" width="250" height="100" rx="8" fill="#c5f6fa" stroke="#0b7285" stroke-width="2.2" filter="url(#rough-shape)"/>
    <text x="1135" y="331" text-anchor="middle" class="title" fill="#1e1e1e">5 · Stream OpenAI</text>
    <text x="1135" y="357" text-anchor="middle" class="small" fill="#495057">Strict JSON schema</text>
    <text x="1135" y="376" text-anchor="middle" class="small" fill="#495057">AbortSignal supports Stop</text>
  </g>
  
  <g>
    <rect x="701.5" y="299" width="250" height="115" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1.1" opacity=".38" filter="url(#rough-line)"/>
    <rect x="700" y="300" width="250" height="115" rx="8" fill="#e5dbff" stroke="#7048e8" stroke-width="2.2" filter="url(#rough-shape)"/>
    <text x="825" y="331" text-anchor="middle" class="title" fill="#1e1e1e">6 · Parse + emit SSE</text>
    <text x="825" y="357" text-anchor="middle" class="small" fill="#495057">token · file_start · file_delta</text>
    <text x="825" y="376" text-anchor="middle" class="small" fill="#495057">file_complete · heartbeat</text>
  </g>
  <polygon points="505,300 580,357 505,415 430,357" fill="#fff3bf" stroke="#e67700" stroke-width="2.2" filter="url(#rough-shape)"/>
  <text x="505" y="350" text-anchor="middle" class="title" fill="#1e1e1e">Valid and</text><text x="505" y="372" text-anchor="middle" class="title" fill="#1e1e1e">safe?</text>
  
  <g>
    <rect x="61.5" y="279" width="270" height="140" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1.1" opacity=".38" filter="url(#rough-line)"/>
    <rect x="60" y="280" width="270" height="140" rx="8" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2.2" filter="url(#rough-shape)"/>
    <text x="195" y="311" text-anchor="middle" class="title" fill="#1e1e1e">7 · Commit generation</text>
    <text x="195" y="337" text-anchor="middle" class="small" fill="#495057">Validate schema + banned APIs</text>
    <text x="195" y="356" text-anchor="middle" class="small" fill="#495057">Write files, message, snapshot</text>
    <text x="195" y="375" text-anchor="middle" class="small" fill="#495057">in one Firestore batch</text>
  </g>
  
  <g>
    <rect x="61.5" y="519" width="270" height="120" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1.1" opacity=".38" filter="url(#rough-line)"/>
    <rect x="60" y="520" width="270" height="120" rx="8" fill="#dbe4ff" stroke="#4263eb" stroke-width="2.2" filter="url(#rough-shape)"/>
    <text x="195" y="551" text-anchor="middle" class="title" fill="#1e1e1e">8 · Reveal + preview</text>
    <text x="195" y="577" text-anchor="middle" class="small" fill="#1e1e1e">Animate Monaco diffs</text>
    <text x="195" y="596" text-anchor="middle" class="small" fill="#1e1e1e">Rebuild CSP sandbox iframe</text>
  </g>
  
  <g>
    <rect x="391.5" y="519" width="240" height="120" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1.1" opacity=".38" filter="url(#rough-line)"/>
    <rect x="390" y="520" width="240" height="120" rx="8" fill="#e5dbff" stroke="#7048e8" stroke-width="2.2" filter="url(#rough-shape)"/>
    <text x="510" y="551" text-anchor="middle" class="title" fill="#1e1e1e">Runtime data path</text>
    <text x="510" y="577" text-anchor="middle" class="small" fill="#495057">iframe → postMessage → /api/v1 proxy</text>
    <text x="510" y="596" text-anchor="middle" class="small" fill="#495057">→ real HighLevel data</text>
  </g>
  
  <g>
    <rect x="701.5" y="519" width="270" height="120" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1.1" opacity=".38" filter="url(#rough-line)"/>
    <rect x="700" y="520" width="270" height="120" rx="8" fill="#ffe3e3" stroke="#c92a2a" stroke-width="2.2" filter="url(#rough-shape)"/>
    <text x="835" y="551" text-anchor="middle" class="title" fill="#1e1e1e">Recover gracefully</text>
    <text x="835" y="577" text-anchor="middle" class="small" fill="#495057">Preserve partial/completed files</text>
    <text x="835" y="596" text-anchor="middle" class="small" fill="#495057">Emit error · release lock</text>
  </g>
  
  <g>
    <path d="M 290 140 Q 333 137 370 140" fill="none" stroke="#1e1e1e" stroke-width="1" opacity=".45" filter="url(#rough-line)"/>
    <path d="M 290 140 Q 328 142 370 140" fill="none" stroke="#1e1e1e" stroke-width="2.4" marker-end="url(#arrow)" filter="url(#rough-line)"/>
    
  </g> 
  <g>
    <path d="M 620 150 Q 663 147 700 150" fill="none" stroke="#1e1e1e" stroke-width="1" opacity=".45" filter="url(#rough-line)"/>
    <path d="M 620 150 Q 658 152 700 150" fill="none" stroke="#1e1e1e" stroke-width="2.4" marker-end="url(#arrow)" filter="url(#rough-line)"/>
    
  </g> 
  <g>
    <path d="M 950 150 Q 983 147 1010 150" fill="none" stroke="#1e1e1e" stroke-width="1" opacity=".45" filter="url(#rough-line)"/>
    <path d="M 950 150 Q 978 152 1010 150" fill="none" stroke="#1e1e1e" stroke-width="2.4" marker-end="url(#arrow)" filter="url(#rough-line)"/>
    
  </g>
  
  <g>
    <path d="M 1135 200 Q 1138 247 1135 300" fill="none" stroke="#1e1e1e" stroke-width="1" opacity=".45" filter="url(#rough-line)"/>
    <path d="M 1135 200 Q 1133 252 1135 300" fill="none" stroke="#1e1e1e" stroke-width="2.4" marker-end="url(#arrow)" filter="url(#rough-line)"/>
    
  </g> 
  <g>
    <path d="M 1010 355 Q 983 352 950 355" fill="none" stroke="#1e1e1e" stroke-width="1" opacity=".45" filter="url(#rough-line)"/>
    <path d="M 1010 355 Q 978 357 950 355" fill="none" stroke="#1e1e1e" stroke-width="2.4" marker-end="url(#arrow)" filter="url(#rough-line)"/>
    
  </g> 
  <g>
    <path d="M 700 355 Q 643 352 580 355" fill="none" stroke="#1e1e1e" stroke-width="1" opacity=".45" filter="url(#rough-line)"/>
    <path d="M 700 355 Q 638 357 580 355" fill="none" stroke="#1e1e1e" stroke-width="2.4" marker-end="url(#arrow)" filter="url(#rough-line)"/>
    
  </g>
  
  <g>
    <path d="M 430 357 Q 383 350.5 330 350" fill="none" stroke="#1e1e1e" stroke-width="1" opacity=".45" filter="url(#rough-line)"/>
    <path d="M 430 357 Q 378 355.5 330 350" fill="none" stroke="#1e1e1e" stroke-width="2.4" marker-end="url(#arrow)" filter="url(#rough-line)"/>
    <rect x="325" y="339.5" width="110" height="22" rx="3" fill="#ffffff" filter="url(#rough-shape)"/><text x="380" y="355.5" text-anchor="middle" class="label">yes</text>
  </g> 
  <g>
    <path d="M 195 420 Q 198 467 195 520" fill="none" stroke="#1e1e1e" stroke-width="1" opacity=".45" filter="url(#rough-line)"/>
    <path d="M 195 420 Q 193 472 195 520" fill="none" stroke="#1e1e1e" stroke-width="2.4" marker-end="url(#arrow)" filter="url(#rough-line)"/>
    <rect x="140" y="456" width="110" height="22" rx="3" fill="#ffffff" filter="url(#rough-shape)"/><text x="195" y="472" text-anchor="middle" class="label">snapshot</text>
  </g>
  
  <g>
    <path d="M 330 580 Q 363 577 390 580" fill="none" stroke="#1e1e1e" stroke-width="1" opacity=".45" filter="url(#rough-line)"/>
    <path d="M 330 580 Q 358 582 390 580" fill="none" stroke="#1e1e1e" stroke-width="2.4" marker-end="url(#arrow)" filter="url(#rough-line)"/>
    
  </g> 
  <g>
    <path d="M 505 415 Q 645.5 464.5 780 520" fill="none" stroke="#e03131" stroke-width="1" opacity=".45" filter="url(#rough-line)"/>
    <path d="M 505 415 Q 640.5 469.5 780 520" fill="none" stroke="#e03131" stroke-width="2.4" marker-end="url(#arrow)" filter="url(#rough-line)"/>
    <rect x="587.5" y="453.5" width="110" height="22" rx="3" fill="#ffffff" filter="url(#rough-shape)"/><text x="642.5" y="469.5" text-anchor="middle" class="label">no / stop / error</text>
  </g>

</svg>
